name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish app
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project CleanArchiver.xcodeproj \
            -scheme CleanArchiver \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            clean build

      - name: Verify app
        run: |
          APP="build/DerivedData/Build/Products/Release/CleanArchiver.app"
          sh scripts/test_archive_outputs.sh "$APP"
          sh scripts/verify_release_metadata.sh "$APP" "$GITHUB_REF_NAME" 1200

      - name: Archive app
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP="build/DerivedData/Build/Products/Release/CleanArchiver.app"
          ARCHIVE="CleanArchiver-${TAG}-macOS-arm64.zip"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          echo "RELEASE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_ARCHIVE" --clobber
          else
            gh release create "$TAG" "$RELEASE_ARCHIVE" \
              --title "$TAG" \
              --generate-notes
          fi
