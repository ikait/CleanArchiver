name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project CleanArchiver.xcodeproj \
            -scheme CleanArchiver \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            clean build

      - name: Test archive outputs
        run: sh scripts/test_archive_outputs.sh
