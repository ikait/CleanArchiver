name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: sh scripts/build_release_app.sh

      - name: Run Xcode model tests
        run: sh scripts/test_xcode_models.sh

      - name: Test archive outputs
        run: sh scripts/test_archive_outputs.sh
